<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUA SCAN - Mobile Water Quality Report</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .report-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      color: #38bdf8;
      margin-top: 0;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.75rem;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #334155;
    }
    .data-row:last-child {
      border-bottom: none;
    }
    .label {
      color: #94a3b8;
      font-weight: 600;
    }
    .val {
      font-weight: 800;
    }
    .status-safe { color: #10b981; }
    .status-warning { color: #f59e0b; }
    .status-danger { color: #ef4444; }
  </style>
</head>
<body>
  <div class="report-card">
    <h1>Live Scan Report</h1>
    <div class="data-row"><span class="label">Status</span><span class="val" id="val-status">Loading...</span></div>
    <div class="data-row"><span class="label">WQI Score</span><span class="val" id="val-wqi">-</span></div>
    <div class="data-row"><span class="label">pH Level</span><span class="val" id="val-ph">-</span></div>
    <div class="data-row"><span class="label">Turbidity</span><span class="val" id="val-turb">-</span></div>
    <div class="data-row"><span class="label">TDS</span><span class="val" id="val-tds">-</span></div>
    <div class="data-row"><span class="label">Temperature</span><span class="val" id="val-temp">-</span></div>
    <div class="data-row"><span class="label">Heavy Metals</span><span class="val" id="val-metal">-</span></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fzqvjvcpvilmzlniadfn.supabase.co/rest/v1';
    const SUPABASE_KEY = 'sb_publishable_vHuqJuAhBDkzyRMnIFvQeA_3ASoVoHd';

    async function fetchReportData() {
      try {
        const res = await fetch(`${SUPABASE_URL}/sensor_readings?select=*&order=id.desc&limit=1`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (!res.ok) throw new Error('Failed to fetch telemetry');
        const rows = await res.json();
        if (!rows || rows.length === 0) return;

        const row = rows[0];
        const ph = parseFloat(row.ph_level ?? 7.0);
        const turb = parseFloat(row.turbidity ?? 1.0);
        const tds = parseFloat(row.tds_value ?? 150.0);
        const temp = parseFloat(row.temperature ?? 25.0);
        const metal = parseFloat(row.heavymetal ?? row.heavyMetal ?? 0.005);

        let status = 'SAFE';
        let score = 95;
        if (ph < 6.5 || ph > 8.5 || turb > 5.0 || tds > 500) {
          status = 'WARNING';
          score = 65;
        }
        if (ph < 5.5 || ph > 9.5 || turb > 10.0 || tds > 1000 || metal > 0.010) {
          status = 'HAZARDOUS';
          score = 30;
        }

        const statusEl = document.getElementById('val-status');
        statusEl.textContent = status;
        if (status === 'SAFE') statusEl.className = 'val status-safe';
        else if (status === 'WARNING') statusEl.className = 'val status-warning';
        else statusEl.className = 'val status-danger';

        document.getElementById('val-wqi').textContent = score + '/100';
        document.getElementById('val-ph').textContent = ph;
        document.getElementById('val-turb').textContent = turb + ' NTU';
        document.getElementById('val-tds').textContent = tds + ' mg/L';
        document.getElementById('val-temp').textContent = temp + ' °C';
        document.getElementById('val-metal').textContent = metal + ' mg/L';
      } catch (err) {
        console.error('Error loading report:', err);
        document.getElementById('val-status').textContent = 'Error loading data';
      }
    }

    fetchReportData();
  </script>
</body>
</html>
